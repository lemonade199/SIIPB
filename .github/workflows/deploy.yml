# CD SIIPB: push ke main -> pytest -> build & push 3 image ke Amazon ECR -> SSH ke EC2 -> deploy.
#
# Prasyarat (lihat docs/DEVOPS-DEPLOYMENT.md):
#   Secrets  : EC2_SSH_PRIVATE_KEY + salah satu:
#              - AWS_DEPLOY_ROLE_ARN (OIDC, role dari stack CloudFormation 03-app; tanpa access key), atau
#              - AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN (AWS Academy; kedaluwarsa tiap sesi lab)
#   Variables: AWS_REGION, EC2_HOST, EC2_SECURITY_GROUP_ID, APP_DOMAIN, INSTITUTION_NAME
name: Deploy Production

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  test:
    name: Unit test (pytest)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: mariadb+pymysql://root:root@127.0.0.1:3306/siipb_test?charset=utf8mb4
      SECRET_KEY: ci-secret
      JWT_SECRET_KEY: ci-jwt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Pustaka sistem (WeasyPrint, mariadb-dump)
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 mariadb-client
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  build:
    name: Build & push ${{ matrix.image }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: backend
            context: backend
            dockerfile: backend/Dockerfile
          - image: worker
            context: backend
            dockerfile: backend/Dockerfile.worker
          - image: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # Mode OIDC: isi AWS_DEPLOY_ROLE_ARN. Mode AWS Academy (tanpa IAM): kosongkan role,
          # isi AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_SESSION_TOKEN dari "AWS Details" lab.
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/siipb-${{ matrix.image }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/siipb-${{ matrix.image }}:latest
          # hanya dipakai Dockerfile frontend (NEXT_PUBLIC_* dibaca saat build)
          build-args: |
            NEXT_PUBLIC_DATA_SOURCE=api
            NEXT_PUBLIC_API_BASE_URL=/api/v1
            NEXT_PUBLIC_INSTITUTION=${{ vars.INSTITUTION_NAME }}
            NEXT_PUBLIC_SHOW_DEMO_ACCOUNTS=false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy ke EC2
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.APP_DOMAIN }}
    env:
      EC2_HOST: ${{ vars.EC2_HOST }}
      SG_ID: ${{ vars.EC2_SECURITY_GROUP_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # Mode OIDC: isi AWS_DEPLOY_ROLE_ARN. Mode AWS Academy (tanpa IAM): kosongkan role,
          # isi AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_SESSION_TOKEN dari "AWS Details" lab.
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # Port 22 hanya terbuka untuk IP admin; IP runner ditambahkan sementara lalu dicabut di akhir.
      - name: Buka SSH sementara untuk IP runner
        id: runner
        run: |
          IP=$(curl -fsS https://checkip.amazonaws.com)
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress --group-id "$SG_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$IP/32,Description=github-actions-run-${{ github.run_id }}}]"

      - name: Siapkan kunci SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          for _ in 1 2 3 4 5; do ssh-keyscan -T 10 -H "$EC2_HOST" >> ~/.ssh/known_hosts && break; sleep 5; done
          echo "SSH=ssh -i $HOME/.ssh/id_deploy -o ServerAliveInterval=30 ubuntu@$EC2_HOST" >> "$GITHUB_ENV"

      - name: Salin berkas deploy (compose, skrip, Nginx)
        run: |
          tar czf - -C deploy . | $SSH 'tar xzf - -C /opt/siipb && chmod +x /opt/siipb/scripts/*.sh'

      - name: Pull image dari ECR & restart container
        run: $SSH "/opt/siipb/scripts/deploy.sh ${{ github.sha }}"

      - name: Smoke test
        run: curl -fsSL --retry 5 --retry-delay 5 "http://$EC2_HOST/api/health"

      - name: Tutup SSH untuk IP runner
        if: always() && steps.runner.outputs.ip != ''
        run: |
          aws ec2 revoke-security-group-ingress --group-id "$SG_ID" \
            --protocol tcp --port 22 --cidr "${{ steps.runner.outputs.ip }}/32"
