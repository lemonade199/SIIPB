# CI SIIPB (dokumen Plan §8 & §22): backend pytest (MariaDB + migrasi), frontend lint/typecheck/vitest/build,
# Playwright mode mock, uji integrasi frontend ↔ API, dan validasi docker compose.
name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: mariadb+pymysql://root:root@127.0.0.1:3306/siipb_test?charset=utf8mb4
      SECRET_KEY: ci-secret
      JWT_SECRET_KEY: ci-jwt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Pustaka sistem (WeasyPrint, mariadb-dump)
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 mariadb-client
      - run: pip install -r requirements.txt
      - name: pytest (unit, API, RBAC, notifikasi, laporan)
        run: python -m pytest -q
      - name: Migrasi naik-turun
        env:
          DATABASE_URL: mariadb+pymysql://root:root@127.0.0.1:3306/siipb_test?charset=utf8mb4
        run: alembic downgrade f627cba678a2 && alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Playwright (mode mock)
        run: npx playwright test tests/e2e/mock.spec.ts

  integration:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: siipb
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mariadb+pymysql://root:root@127.0.0.1:3306/siipb?charset=utf8mb4
      NOTIFICATION_DISPATCH: sync
      CORS_ORIGINS: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - name: Backend (migrasi + seed + server)
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python scripts/seed_data.py
          nohup python -c "from app import create_app; create_app().run(host='127.0.0.1', port=5000)" > /tmp/backend.log 2>&1 &
          sleep 5 && curl -fsS http://127.0.0.1:5000/api/health
      - name: Frontend mode api + Playwright integrasi
        working-directory: frontend
        env:
          NEXT_PUBLIC_DATA_SOURCE: api
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5000/api/v1
          E2E_API: "1"
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/api.spec.ts
      - if: failure()
        run: cat /tmp/backend.log

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validasi docker compose & build image
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose build backend frontend
