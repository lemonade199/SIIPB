# SIIPB — Nginx host EC2, mode HTTP (dipakai sebelum sertifikat Let's Encrypt terbit).
# Dipasang ke /etc/nginx/sites-available/siipb.conf; __DOMAIN__ diganti saat pemasangan.
# Setelah DNS mengarah ke Elastic IP: /opt/siipb/scripts/setup-ssl.sh -> beralih ke siipb.https.conf

limit_req_zone $binary_remote_addr zone=siipb_login:10m rate=10r/m;

upstream siipb_backend  { server 127.0.0.1:5000; }
upstream siipb_frontend { server 127.0.0.1:3000; }

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __DOMAIN__;

    # ACME HTTP-01 challenge (certbot --webroot)
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    include /etc/nginx/snippets/siipb-locations.conf;
}
