# SIIPB — Nginx host EC2, mode HTTPS wajib (sertifikat Let's Encrypt dari Certbot).
# Dipasang oleh setup-ssl.sh / deploy.sh bila /etc/letsencrypt/live/__DOMAIN__ sudah ada.

limit_req_zone $binary_remote_addr zone=siipb_login:10m rate=10r/m;

upstream siipb_backend  { server 127.0.0.1:5000; }
upstream siipb_frontend { server 127.0.0.1:3000; }

# HTTP -> HTTPS (kecuali ACME challenge untuk perpanjangan sertifikat)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://__DOMAIN__$request_uri; }
}

server {
    # Nginx 1.24 (Ubuntu 24.04): http2 masih diaktifkan lewat parameter listen
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/snippets/siipb-locations.conf;
}
