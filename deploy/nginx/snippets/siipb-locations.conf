# SIIPB — lokasi reverse proxy bersama (di-include oleh siipb.http.conf & siipb.https.conf)
#   /api/      -> Flask API (container backend, 127.0.0.1:5000)
#   /uploads/  -> foto/berkas barang langsung dari disk (/opt/siipb/uploads, disinkron ke S3)
#   /          -> Next.js (container frontend, 127.0.0.1:3000)

client_max_body_size 30M;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

location /api/ {
    proxy_pass http://siipb_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 30s;
    proxy_read_timeout 180s;
}

# pembatasan percobaan login (brute force)
location = /api/v1/auth/login {
    limit_req zone=siipb_login burst=10 nodelay;
    proxy_pass http://siipb_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /flasgger_static/ { proxy_pass http://siipb_backend; }
location = /apispec_1.json { proxy_pass http://siipb_backend; }

location /uploads/ {
    alias /opt/siipb/uploads/;
    access_log off;
    expires 7d;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'" always;
    location ~* \.(php|html?|js|svg)$ { deny all; }
}

location /_next/static/ {
    proxy_pass http://siipb_frontend;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location / {
    proxy_pass http://siipb_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
